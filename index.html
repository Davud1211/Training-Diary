<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10141a">
<title>Тренировочный план</title>
<style>
:root{color-scheme:dark;--bg:#10141a;--line:#2a3441;--text:#d9e0e8;--muted:#8995a4;--red:#ed7777;--red-bg:#392329;--blue:#78aee8;--blue-bg:#202f43;--shadow:0 18px 55px #0005}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#26303d 0%,transparent 55%),var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:28px 16px 42px}.shell{width:min(760px,100%);margin:0 auto}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 2px 22px}.brand{font-size:11px;letter-spacing:.19em;font-weight:800;color:#9aa7b6}.brand-mark{display:inline-block;width:8px;height:8px;border-radius:50%;background:#a6c995;margin-right:8px;box-shadow:0 0 12px #a6c95566}.date-chip{font-size:12px;color:var(--muted);border:1px solid var(--line);background:#151b23;padding:7px 11px;border-radius:30px}.card{background:linear-gradient(160deg,#1a222c,#151b23 70%);border:1px solid #2a3542;border-radius:23px;box-shadow:var(--shadow);overflow:hidden}.balance{padding:25px 27px 22px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line)}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800}.balance-number{font-size:clamp(48px,10vw,68px);line-height:1;font-weight:750;letter-spacing:-.065em;margin-top:8px;color:#edf1f5;font-variant-numeric:tabular-nums}.balance-number span{font-size:17px;letter-spacing:0;color:var(--muted);font-weight:550;margin-left:8px}.edit-button{border:1px solid #3a4654;background:#202a36;color:#cbd4df;border-radius:11px;padding:10px 13px;font-weight:650;cursor:pointer;white-space:nowrap}.edit-button:hover{background:#293544;border-color:#536174}.edit-panel{display:none;padding:16px 27px;background:#131a22;border-bottom:1px solid var(--line)}.edit-panel.open{display:block}.edit-row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:150px}label{font-size:11px;color:var(--muted);font-weight:700}input{width:100%;background:#0f141b;border:1px solid #354252;color:var(--text);padding:11px 12px;border-radius:10px;font:inherit;outline:none}input:focus{border-color:#8ca4bd;box-shadow:0 0 0 3px #8ca4bd22}.save{border:0;border-radius:10px;background:#d4dde6;color:#17202a;font-weight:800;padding:11px 16px;cursor:pointer}.cancel{border:1px solid #3a4654;border-radius:10px;background:transparent;color:#aeb8c4;padding:10px 13px;cursor:pointer}.day-block{padding:28px 27px 25px}.day-name{font-size:clamp(29px,6vw,40px);font-weight:750;letter-spacing:-.045em;margin:0;color:#e7ecf1}.plan-line{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}.plan-label{font-size:13px;color:var(--muted)}.plan-pill{font-size:12px;font-weight:850;letter-spacing:.08em;padding:6px 11px;border-radius:8px}.plan-pill.a{color:var(--red);background:var(--red-bg);border:1px solid #67404a}.plan-pill.b{color:var(--blue);background:var(--blue-bg);border:1px solid #3c5878}.plan-pill.rest{color:#a9b6a5;background:#263128;border:1px solid #3d5140;letter-spacing:.02em}.rule{height:1px;background:var(--line);margin:0 27px}.workout{padding:19px 27px 25px}.workout-title{font-size:11px;letter-spacing:.15em;color:var(--muted);font-weight:800;text-transform:uppercase;margin:0 0 13px}.exercise-list{display:grid;gap:8px}.exercise{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 14px;background:#1a222c;border:1px solid #293441;border-radius:12px;min-height:47px}.exercise-name{font-size:14px;font-weight:620;color:#d3dbe4}.mode{flex:0 0 34px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:900;font-size:13px}.mode.h{color:var(--red);background:var(--red-bg);border:1px solid #67404a}.mode.l{color:var(--blue);background:var(--blue-bg);border:1px solid #3c5878}.legend{display:flex;gap:15px;align-items:center;margin-top:16px;color:var(--muted);font-size:11px;flex-wrap:wrap}.legend-item{display:flex;align-items:center;gap:6px}.legend-dot{width:8px;height:8px;border-radius:50%}.legend-dot.h{background:var(--red)}.legend-dot.l{background:var(--blue)}.rest-state{padding:8px 0 4px;text-align:center}.bear-wrap{width:min(290px,78%);margin:0 auto 10px}.bear-wrap svg{display:block;width:100%;height:auto}.rest-title{font-size:21px;font-weight:700;color:#dce3e9;margin:5px 0}.rest-copy{font-size:13px;color:var(--muted);margin:0}.footer{text-align:center;color:#657180;font-size:11px;margin:18px 0 0}@media(max-width:520px){body{padding:16px 11px 28px}.topline{margin-bottom:14px}.balance{padding:21px 19px}.edit-panel{padding:14px 19px}.day-block{padding:23px 19px 21px}.rule{margin:0 19px}.workout{padding:17px 19px 21px}.exercise{padding:11px 12px}.exercise-name{font-size:13px}}
</style>
</head>
<body>
<div class="shell">
 <div class="topline"><div class="brand"><span class="brand-mark"></span>TRAINING LOG</div><div class="date-chip" id="dateChip">—</div></div>
 <main class="card">
  <section class="balance"><div><div class="eyebrow">Остаток тренировок</div><div class="balance-number"><span id="balanceValue" style="font-size:inherit;color:inherit;margin:0">7</span><span>занятий</span></div></div><button class="edit-button" id="editToggle" type="button">Изменить</button></section>
  <section class="edit-panel" id="editPanel"><div class="edit-row"><div class="field"><label for="newBalance">Новое количество занятий</label><input id="newBalance" type="number" min="0" step="1" inputmode="numeric" value="7"></div><button class="save" id="saveBalance" type="button">Сохранить</button><button class="cancel" id="cancelEdit" type="button">Отмена</button></div></section>
  <section class="day-block"><div class="eyebrow">СЕГОДНЯ</div><h1 class="day-name" id="dayName">—</h1><div class="plan-line"><span class="plan-label">Твой план на сегодня:</span><span class="plan-pill rest" id="planPill">Восстановление</span></div></section>
  <div class="rule"></div>
  <section class="workout"><h2 class="workout-title" id="workoutTitle">Сегодняшняя тренировка</h2><div class="exercise-list" id="exerciseList"></div><div class="legend"><span class="legend-item"><span class="legend-dot h"></span>H — силовой режим</span><span class="legend-item"><span class="legend-dot l"></span>L — многоповторный режим</span></div></section>
 </main>
 <div class="footer">План обновляется автоматически · Данные хранятся на этом устройстве</div>
</div>
<script>
(()=>{
 const KEY='training-log-dashboard-v2',START='2026-10-30',INITIAL=7,DAYS=new Set([2,4,6]);
 const dayNames=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
 const months=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
 const A=[['Жим штанги','H'],['Жим гантелей','L'],['Широчайшие','H'],['Бицепс','H'],['Молотки','L'],['Супинатор','H'],['Пронатор','L'],['Дельты','L'],['Трицепс','H'],['Жим ногами','H'],['Разгибание ног','L'],['Сгибание ног','H'],['Гиперэкстензия','L']];
 const B=[['Жим гантелей','H'],['Жим штанги','L'],['Широчайшие','L'],['Бицепс','L'],['Молотки','H'],['Супинатор','L'],['Пронатор','H'],['Дельты','H'],['Трицепс','L'],['Жим ногами','L'],['Разгибание ног','H'],['Сгибание ног','L'],['Гиперэкстензия','H']];
 const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');
 const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
 const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)};
 const isTraining=d=>DAYS.has(d.getDay());
 let state;
 try{const s=JSON.parse(localStorage.getItem(KEY)||'null');state=s&&Number.isInteger(s.balance)&&typeof s.lastProcessed==='string'&&Number.isInteger(s.workoutCount)?s:{balance:INITIAL,lastProcessed:START,workoutCount:0}}
 catch{state={balance:INITIAL,lastProcessed:START,workoutCount:0}}
 function save(){localStorage.setItem(KEY,JSON.stringify(state))}
 // Every scheduled date after the start date is charged once, even if the page was closed.
 function processDates(){const today=key(new Date());if(state.lastProcessed<START)state.lastProcessed=START;if(state.lastProcessed>=today)return;let d=parse(state.lastProcessed),end=parse(today);while(d<end){d.setDate(d.getDate()+1);if(isTraining(d)){state.balance=Math.max(0,state.balance-1);state.workoutCount++}}state.lastProcessed=today;save()}
 function render(){const now=new Date();$('dateChip').textContent=`${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;$('dayName').textContent=dayNames[now.getDay()];$('balanceValue').textContent=state.balance;const pill=$('planPill'),list=$('exerciseList'),legend=document.querySelector('.legend');
  if(isTraining(now)){const isA=(Math.max(0,state.workoutCount-1)%2===0),plan=isA?A:B;pill.textContent=isA?'План А':'План Б';pill.className='plan-pill '+(isA?'a':'b');$('workoutTitle').textContent='Сегодняшняя тренировка';list.innerHTML=plan.map(([name,mode])=>`<div class="exercise"><span class="exercise-name">${name}</span><span class="mode ${mode.toLowerCase()}">${mode}</span></div>`).join('');legend.style.display='flex'}
  else{pill.textContent='Восстановление';pill.className='plan-pill rest';$('workoutTitle').textContent='Сегодня отдыхаем';legend.style.display='none';list.innerHTML=`<div class="rest-state"><div class="bear-wrap" aria-label="Спящий мультяшный медведь"><svg viewBox="0 0 320 230" role="img" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="pillow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#34475b"/><stop offset="1" stop-color="#202e40"/></linearGradient><linearGradient id="fur" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c99a70"/><stop offset="1" stop-color="#9d6d4e"/></linearGradient></defs><ellipse cx="162" cy="187" rx="119" ry="17" fill="#0b1016" opacity=".55"/><path d="M49 157c0-33 25-54 63-54h107c31 0 55 20 55 48v24c0 17-13 29-31 29H83c-21 0-34-17-34-47z" fill="url(#pillow)" stroke="#496078" stroke-width="3"/><path d="M88 144c13-32 42-49 79-48 40 1 74 27 77 62 2 29-20 45-57 45h-37c-48 0-80-23-62-59z" fill="url(#fur)" stroke="#76513d" stroke-width="3"/><circle cx="113" cy="105" r="24" fill="#a97957" stroke="#76513d" stroke-width="3"/><circle cx="113" cy="105" r="12" fill="#d6aa89"/><circle cx="214" cy="112" r="21" fill="#a97957" stroke="#76513d" stroke-width="3"/><circle cx="214" cy="112" r="10" fill="#d6aa89"/><path d="M91 151c14-25 39-37 70-34 23 2 43 14 52 33 8 17-2 34-24 39-34 9-86-1-98-19-4-6-4-13 0-19z" fill="#bd8c65"/><ellipse cx="156" cy="159" rx="36" ry="25" fill="#e0bc98"/><path d="M143 155q8 8 16 0M165 155q8 8 16 0" fill="none" stroke="#49372e" stroke-width="3" stroke-linecap="round"/><ellipse cx="160" cy="146" rx="7" ry="5" fill="#49372e"/><path d="M160 151q-7 9-15 3" fill="none" stroke="#49372e" stroke-width="2" stroke-linecap="round"/><path d="M190 76q13-19 27-7" fill="none" stroke="#8b9cad" stroke-width="3" stroke-linecap="round"/><text x="218" y="65" fill="#9db2c6" font-size="21" font-weight="700">Z</text><text x="240" y="42" fill="#9db2c6" font-size="15" font-weight="700">z</text><text x="255" y="25" fill="#9db2c6" font-size="11" font-weight="700">z</text><path d="M76 171q-12 7-18-2M228 179q14 8 20-4" fill="none" stroke="#d7b08e" stroke-width="7" stroke-linecap="round"/></svg></div><div class="rest-title">Сегодня восстановление</div><p class="rest-copy">Отдых тоже часть прогресса. Дай мышцам восстановиться.</p></div>`}}
 $('editToggle').addEventListener('click',()=>{$('newBalance').value=state.balance;$('editPanel').classList.toggle('open');if($('editPanel').classList.contains('open'))$('newBalance').focus()});$('cancelEdit').addEventListener('click',()=>$('editPanel').classList.remove('open'));$('saveBalance').addEventListener('click',()=>{const v=Number($('newBalance').value);if(!Number.isInteger(v)||v<0){alert('Введи целое число от нуля и выше.');return}state.balance=v;save();render();$('editPanel').classList.remove('open')});$('newBalance').addEventListener('keydown',e=>{if(e.key==='Enter')$('saveBalance').click();if(e.key==='Escape')$('cancelEdit').click()});
 function refresh(){processDates();render()}refresh();setInterval(refresh,30000);window.addEventListener('focus',refresh);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
})();
</script>
</body>
</html>
